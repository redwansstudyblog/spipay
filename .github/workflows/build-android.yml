name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt

      - name: Save log on failure
        if: failure()
        run: |
          mkdir -p ../.github/ci-logs
          cp build_log.txt ../.github/ci-logs/last-build-log.txt
          cd ..
          git config user.email "ci@spipay.local"
          git config user.name "spipay-ci"
          git add .github/ci-logs/last-build-log.txt
          git commit -m "ci: save failed build log [skip ci]" || echo "nothing to commit"
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spidpay-agent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
